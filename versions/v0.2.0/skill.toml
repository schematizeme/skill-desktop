[descriptions]
pt = "Engenharia de software LOCAL/NATIVO/DESKTOP da casa: o mesmo piso (segurança, IAM, testes, ops, DoD, archive) na máquina do usuário, onde não há servidor pra segurar a barra — irmã de mobile e web. Escolha de toolkit de GUI (viés Slint/Rust; Tauri com justificativa; egui NÃO como principal — fantasma de layout; GTK/Qt; UM só toolkit por produto); empacotamento cross-OS (.deb/.rpm/AppImage/Flatpak, .dmg+notarization, MSI/MSIX+assinatura; binário pré-compilado vs fonte, híbrido); auto-update DESACOPLADO (app quebrado não trava o update; pin/rollback; a armadilha do git-dep no Cargo.lock que embute versão VELHA — cargo update -p antes de compilar; matar processo antigo + re-exec); estado local (dirs XDG/por SO, migração de schema reversível, backup, sync eventual); privilégio (root→usuário real nunca /root, elevar só onde precisa, launcher com Exec ABSOLUTO, single-instance, IPC local); cross-OS (path/processo/launcher, fontes CJK/árabe, Wayland/X11); privacidade (sem telemetria por padrão, opt-in); segurança (supply chain de deps nativas, assinatura de binário, NUNCA segredo no cliente); testes (GUI headless/CI, smoke de empacotamento, update ponta-a-ponta). PISOS: UX de massa (prever macacos — o software se adapta e nunca culpa o usuário); um só toolkit; updater desacoplado + versão embutida coerente; launcher com path absoluto; sem segredo no cliente."
en = "House LOCAL/NATIVE/DESKTOP software engineering: the same floor (security, IAM, testing, ops, DoD, archive) on the user's machine, where there is NO server to hold the line — sister of mobile and web. GUI toolkit choice (bias Slint/Rust; Tauri with justification; egui NOT as the primary one — layout ghost; GTK/Qt; ONE toolkit per product); cross-OS packaging (.deb/.rpm/AppImage/Flatpak, .dmg+notarization, MSI/MSIX+signing; prebuilt binary vs source, hybrid); DECOUPLED auto-update (a broken app doesn't block the update; pin/rollback; the git-dep-in-Cargo.lock trap that embeds an OLD version — cargo update -p before building; kill the old process + re-exec); local state (XDG/per-OS dirs, reversible schema migration, backup, eventual sync); privilege (root→real user never /root, elevate only where needed, launcher with ABSOLUTE Exec, single-instance, local IPC); cross-OS (path/process/launcher, CJK/Arabic fonts, Wayland/X11); privacy (no telemetry by default, opt-in); security (native dependency supply chain, binary signing, NEVER a secret in the client); testing (headless GUI/CI, packaging smoke test, end-to-end update). FLOORS: mass UX (predict the layperson — the software adapts and never blames the user); one toolkit; decoupled updater + always-coherent embedded version; launcher with absolute path; no secret in the client."
es = "Ingeniería de software LOCAL/NATIVO/DESKTOP de la casa: el mismo piso (seguridad, IAM, pruebas, ops, DoD, archive) en la máquina del usuario, donde NO hay servidor que sostenga la barra — hermana de mobile y web. Elección de toolkit de GUI (sesgo Slint/Rust; Tauri con justificación; egui NO como principal — fantasma de layout; GTK/Qt; UN solo toolkit por producto); empaquetado cross-OS (.deb/.rpm/AppImage/Flatpak, .dmg+notarization, MSI/MSIX+firma; binario precompilado vs fuente, híbrido); auto-update DESACOPLADO (una app rota no bloquea el update; pin/rollback; la trampa del git-dep en Cargo.lock que incrusta versión VIEJA — cargo update -p antes de compilar; matar el proceso viejo + re-exec); estado local (dirs XDG/por SO, migración de schema reversible, backup, sync eventual); privilegio (root→usuario real nunca /root, elevar solo donde hace falta, launcher con Exec ABSOLUTO, single-instance, IPC local); cross-OS (path/proceso/launcher, fuentes CJK/árabe, Wayland/X11); privacidad (sin telemetría por defecto, opt-in); seguridad (supply chain de deps nativas, firma de binario, NUNCA un secreto en el cliente); pruebas (GUI headless/CI, smoke de empaquetado, update de punta a punta). PISOS: UX de masa (prever al lego — el software se adapta y nunca culpa al usuario); un solo toolkit; updater desacoplado + versión incrustada coherente; launcher con path absoluto; sin secreto en el cliente."
